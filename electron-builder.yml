appId: com.aljengineering.harness-editor
productName: Harness Editor
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# The headless CLI as a real file next to the asar: Claude Desktop runs its `mcp` bridge with the
# app's own executable as Node (ELECTRON_RUN_AS_NODE), see claudeDesktopConfig in src/main/mcp.
asarUnpack:
  - out/cli/**
mac:
  target: [dmg]
  category: public.app-category.developer-tools
win:
  target: [nsis]
  artifactName: ${productName}-Setup-${version}.${ext}
# Per-user install (no UAC prompt) with the wizard, so the folder can be changed.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  target: [AppImage, deb]
  category: Development
