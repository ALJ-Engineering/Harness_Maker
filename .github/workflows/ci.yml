name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # typecheck + bundle to out/
      - run: npm run build
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win --config electron-builder.yml --publish never
      - name: Upload the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: harness-editor-windows-installer
          path: release/*.exe
          if-no-files-found: error
